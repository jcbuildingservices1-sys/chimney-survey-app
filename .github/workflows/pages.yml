name: Publish Chimney Survey App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chimney-survey-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
      - name: Generate iPhone icon
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 180 -h 180 icon.svg -o icon.png
      - name: Check site assets
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s icon.png
          test -s sw.js
      - name: Upload static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
